services:
    frontend:
        build:
            context: ./frontend
            dockerfile: ../docker/frontend/Dockerfile
        expose:
            - "5173"
        environment:
            VITE_API_URL: '${VITE_API_URL:-http://127.0.0.1}'
            CHOKIDAR_USEPOLLING: 'true'
        entrypoint: ["/bin/sh", "/infra/entrypoint.sh"]
        volumes:
            - ./frontend:/app
            - frontend-node-modules:/app/node_modules
            - ./docker/frontend/entrypoint.sh:/infra/entrypoint.sh:ro
        healthcheck:
            test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 180s
        networks:
            - sail

    web-server:
        image: nginx:latest
        ports:
            - "80:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - nginx-cache:/var/cache/nginx
        depends_on:
            frontend:
                condition: service_healthy
            api:
                condition: service_healthy
        networks:
            - sail

    api:
        build:
            context: './backend'
            dockerfile: '../docker/api/Dockerfile'
            args:
                WWWUSER: '${WWWUSER:-1000}'
                WWWGROUP: '${WWWGROUP:-1000}'
                INSTALL_XDEBUG: '${INSTALL_XDEBUG:-false}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        env_file:
            - .env
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            APP_KEY: '${APP_KEY:-}'
            APP_ENV: '${APP_ENV:-production}'
            APP_DEBUG: '${APP_DEBUG:-false}'
            DB_CONNECTION: '${DB_CONNECTION:-mysql}'
            DB_HOST: '${DB_HOST:-mysql}'
            DB_PORT: '${DB_PORT:-3306}'
            DB_DATABASE: '${DB_DATABASE:-laravel}'
            DB_USERNAME: '${DB_USERNAME:-sail}'
            DB_PASSWORD: '${DB_PASSWORD:-}'
        entrypoint: ["/bin/bash", "/infra/bootstrap.sh"]
        volumes:
            - './backend/:/var/www/html/'
            - './docker/api/bootstrap.sh:/infra/bootstrap.sh:ro'
            # Shared with web-server so migrate/seed can purge the catalog cache.
            - nginx-cache:/var/cache/nginx
        healthcheck:
            test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 180s
        networks:
            - sail
        depends_on:
            mailpit:
                condition: service_started
            mysql:
                condition: service_healthy

    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

    phpmyadmin:
        image: phpmyadmin:latest
        ports:
            - '8080:80'
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
        depends_on:
            - mysql
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql:
        driver: local
    frontend-node-modules:
        driver: local
    nginx-cache:
        driver: local
