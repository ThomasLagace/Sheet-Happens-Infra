location = /api/rulesets/current/character-creation-options {
    include /etc/nginx/snippets/api-fastcgi.conf;

    fastcgi_cache ruleset_catalog;
    fastcgi_cache_key "$request_method:$host:$request_uri";
    fastcgi_cache_methods GET HEAD;
    fastcgi_cache_valid 200 7d;
    fastcgi_ignore_headers Cache-Control Expires Set-Cookie Vary;
    fastcgi_hide_header Set-Cookie;

    add_header X-Cache-Status $upstream_cache_status always;
}
