resolver 127.0.0.11 valid=30s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Shared cache for the ruleset catalog JSON (identical for every authenticated user).
# Purged from the API entrypoint after migrate/seed via the nginx-cache volume.
fastcgi_cache_path /var/cache/nginx/ruleset_catalog
    levels=1:2
    keys_zone=ruleset_catalog:10m
    max_size=64m
    inactive=7d
    use_temp_path=off;

# Force the browser onto 127.0.0.1 so Windows does not keep the page on
# localhost (::1-first) while VITE_API_URL / Sanctum use the IPv4 origin.
server {
    listen 80;
    server_name localhost;

    return 301 http://127.0.0.1$request_uri;
}

server {
    listen 80 default_server;
    server_name 127.0.0.1 _;

    location / {
        proxy_pass http://frontend:5173;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Exact match beats the regex /api location. Sanctum still applies on cache
    # miss; hits use a cookie-agnostic key because the body is not user-specific.
    location = /api/rulesets/current/character-creation-options {
        set $backend_upstream api;
        fastcgi_pass $backend_upstream:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;

        fastcgi_cache ruleset_catalog;
        fastcgi_cache_key "$request_method:$host:$request_uri";
        fastcgi_cache_methods GET HEAD;
        fastcgi_cache_valid 200 7d;
        fastcgi_ignore_headers Cache-Control Expires Set-Cookie Vary;
        fastcgi_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;
    }

    location ~ ^/(api|sanctum) {
        set $backend_upstream api;
        fastcgi_pass $backend_upstream:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }
}
