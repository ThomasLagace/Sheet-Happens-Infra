server {
    listen 80;
    server_name localhost;

    return 301 http://127.0.0.1$request_uri;
}

server {
    listen 80 default_server;
    server_name 127.0.0.1 _;

    location / {
        include /etc/nginx/snippets/frontend-proxy.conf;
    }

    # Selected at image build time (cache vs nocache); see docker/nginx/Dockerfile.
    include /etc/nginx/snippets/catalog-location.active.conf;

    location ~ ^/(api|sanctum) {
        include /etc/nginx/snippets/api-fastcgi.conf;
    }
}
